<!DOCTYPE html>
<!-- Joelboard Fit. © 2026 Joel Soluções LTDA. -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Joelboard Fit</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/joelboard.css">
<link rel="stylesheet" href="/themes.css">
<meta name="theme-color" content="#0d0f18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fit">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Chakra+Petch:wght@500;600;700&family=Cormorant+Garamond:wght@500;600&family=Darker+Grotesque:wght@500;700;900&family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/fit.css">
</head>
<body>
<div id="loading"></div>

<div id="app">
  <div class="header">
    <div class="hl"><img src="/icon-192.png" alt="Joelboard"><h1>Fit</h1></div>
    <div class="acct"><span id="acctEmail"></span><button class="lnk" onclick="openSettings()" title="Ajustes">⚙</button><button class="lnk" onclick="fitSignOut()">Sair</button></div>
  </div>
  <div class="tabbar">
    <button class="tabb on" data-tab="hoje" onclick="tab('hoje')">Hoje</button>
    <button class="tabb" data-tab="treinos" onclick="tab('treinos')">Treinos</button>
    <button class="tabb" data-tab="exercicios" onclick="tab('exercicios')">Exercícios</button>
    <button class="tabb" data-tab="progresso" onclick="tab('progresso')">Progresso</button>
    <button class="tabb" data-tab="macros" onclick="tab('macros')">Macros</button>
  </div>

  <div class="page on" id="p-hoje"><div id="hoje"></div></div>
  <div class="page" id="p-treinos"><div class="secbar"><div class="sect">Seus treinos</div><button class="btn" onclick="openTreino()">+ Adicionar</button></div><div id="treinoList"></div></div>
  <div class="page" id="p-exercicios">
    <div class="secbar"><div class="sect">Biblioteca de exercícios</div><button class="btn" onclick="openExercise()">+ Adicionar</button></div>
    <div id="exList"></div>
  </div>
  <div class="page" id="p-progresso"><div id="prog"></div></div>
  <div class="page" id="p-macros"></div>

  <div class="foot">© 2026 Joel Soluções LTDA</div>
</div>

<button class="door" onclick="location.href='/'" title="Voltar ao Joelboard" aria-label="Voltar ao Joelboard">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4h3a2 2 0 0 1 2 2v14"/><path d="M2 20h3"/><path d="M13 20h9"/><path d="M10 12v.01"/><path d="M13 4.562v16.157a1 1 0 0 1-1.242.97L5 20V5.562a2 2 0 0 1 1.515-1.94l4-1A2 2 0 0 1 13 4.561Z"/></svg>
</button>
<button class="fab" id="fab" onclick="fabAdd()" style="display:none;">+</button>

<div class="overlay" id="exOverlay" onclick="if(event.target===this)closeEx()">
  <div class="modal">
    <div class="mh"><div class="mt" id="exTitle">Novo exercício</div><button class="x" onclick="closeEx()">✕</button></div>
    <div class="fg"><label class="fl">Nome</label><input class="field" id="exName" placeholder="ex.: Supino reto"></div>
    <div class="fg"><label class="fl">Grupo muscular</label><select class="field" id="exGroup"></select></div>
    <div class="fg"><label class="fl">Tipo de progressão</label><select class="field" id="exMode"><option value="load">Carga (peso)</option><option value="bw">Peso corporal</option><option value="bwload">Carga + corporal</option><option value="time">Por tempo (segundos)</option></select></div>
    <button class="btn-primary" id="exSave" onclick="saveExercise()">Salvar</button>
    <button class="del" id="exDel" onclick="deleteExercise()" style="display:none;">Excluir exercício</button>
  </div>
</div>

<div class="overlay" id="trOverlay" onclick="if(event.target===this)closeTr()">
  <div class="modal">
    <div class="mh"><div class="mt" id="trTitle">Novo treino</div><button class="x" onclick="closeTr()">✕</button></div>
    <div class="fg"><label class="fl">Nome do treino</label><input class="field" id="trName" placeholder="ex.: Push, Pernas…"></div>
    <div class="fg"><label class="fl">Exercícios do treino (arraste ☰ para reordenar)</label><div id="trSelList"></div></div>
    <div class="fg"><label class="fl">Adicionar exercício</label><input class="field" id="trSearch" placeholder="Buscar ou criar…" oninput="renderTrAdd()"><div id="trAddList" style="max-height:220px;overflow-y:auto;margin-top:8px;border:1px solid var(--border);border-radius:12px;padding:6px;background:var(--surface2)"></div></div>
    <button class="btn-primary" id="trSave" onclick="saveTreino()">Salvar</button>
    <button class="del" id="trDel" onclick="deleteTreino()" style="display:none;">Excluir treino</button>
  </div>
</div>
<div class="overlay" id="sessPickOverlay" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal"><div class="mh"><div class="mt">Adicionar exercício</div><button class="x" onclick="document.getElementById('sessPickOverlay').classList.remove('open')">✕</button></div><div id="sessPickList" style="max-height:340px;overflow-y:auto"></div></div>
</div>
<div class="runover" id="runOverlay">
  <div class="runtop2" id="runTop"></div>
  <div class="runstage" id="runStage"></div>
  <div class="runbtm" id="runBtm"></div>
</div>
<div class="overlay" id="wGoalOverlay" onclick="if(event.target===this)closeWGoal()">
  <div class="modal" style="max-width:340px">
    <div class="mh"><div class="mt">Meta de peso</div><button class="x" onclick="closeWGoal()">✕</button></div>
    <div class="fg"><label class="fl">Peso desejado (kg)</label><input class="field" id="wGoalInput" type="number" inputmode="decimal" step="0.1" placeholder="ex.: 65"></div>
    <button class="btn-primary" onclick="saveWGoal()">Salvar meta</button>
  </div>
</div>
<div class="overlay" id="switchOverlay" onclick="if(event.target===this)closeSwitch()">
  <div class="modal"><div class="mh"><div class="mt">Escolher treino</div><button class="x" onclick="closeSwitch()">✕</button></div><div id="switchList" style="max-height:380px;overflow-y:auto"></div></div>
</div>

<div class="overlay" id="macroAddOverlay" onclick="if(event.target===this)macroCloseAdd()">
  <div class="modal">
    <div class="mh"><div class="mt" id="macroAddTitle">Adicionar alimento</div><button class="x" onclick="macroCloseAdd()">✕</button></div>
    <div id="macroStep1">
      <div class="fg"><input class="field" id="macroSearch" placeholder="🔎 Buscar alimento…" oninput="onMacroSearch(this.value)"></div>
      <div id="macroFavQuick" class="mfav-row" style="margin-bottom:10px"></div>
      <div id="macroSearchList" style="max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:12px;padding:4px;background:var(--surface2)"></div>
    </div>
    <div id="macroStep2" style="display:none">
      <div class="fg"><label class="fl">Quantidade (gramas)</label><input class="field" id="macroGrams" type="number" inputmode="decimal" oninput="macroUpdatePreview()"></div>
      <div id="macroPresets" class="mfav-row" style="margin-bottom:10px"></div>
      <div class="rg" id="macroPreview" style="margin-bottom:12px"></div>
      <button class="btn-primary" onclick="macroConfirmAdd()">Adicionar à refeição</button>
    </div>
  </div>
</div>

<div class="overlay" id="macroEditOverlay" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal" style="max-width:340px">
    <div class="mh"><div class="mt" id="macroEditName">Editar</div><button class="x" onclick="document.getElementById('macroEditOverlay').classList.remove('open')">✕</button></div>
    <div class="fg"><label class="fl">Gramas</label><input class="field" id="macroEditGrams" type="number" inputmode="decimal" oninput="macroEditPreview()"></div>
    <div class="rg" id="macroEditPreview" style="margin-bottom:12px"></div>
    <button class="btn-primary" onclick="macroSaveEdit()">Salvar</button>
  </div>
</div>

<div class="overlay" id="macroCustomOverlay" onclick="if(event.target===this)macroCloseCustom()">
  <div class="modal" style="max-width:360px">
    <div class="mh"><div class="mt" id="macroCustomTitle">Alimento custom</div><button class="x" onclick="macroCloseCustom()">✕</button></div>
    <div class="fg"><label class="fl">Nome</label><input class="field" id="macroCustomName"></div>
    <div class="fg"><label class="fl">Proteína / 100g</label><input class="field" id="macroCustomP" type="number" inputmode="decimal"></div>
    <div class="fg"><label class="fl">Carboidratos / 100g</label><input class="field" id="macroCustomC" type="number" inputmode="decimal"></div>
    <div class="fg"><label class="fl">Gordura / 100g</label><input class="field" id="macroCustomG" type="number" inputmode="decimal"></div>
    <div class="fg"><label class="fl">Kcal / 100g</label><input class="field" id="macroCustomK" type="number" inputmode="decimal"></div>
    <button class="btn ghost" id="macroCustomDel" style="display:none;width:100%;margin-bottom:8px" onclick="macroDeleteCustom()">Excluir alimento</button>
    <button class="btn-primary" id="macroCustomSave" onclick="macroSaveCustom()">Salvar</button>
  </div>
</div>

<div class="overlay" id="macroSetOverlay" onclick="if(event.target===this)closeMacroSettings()">
  <div class="modal">
    <div class="mh"><div class="mt">Metas e refeições</div><button class="x" onclick="closeMacroSettings()">✕</button></div>
    <div class="fg"><label class="fl">Metas diárias</label>
      <div class="macrogoals-grid">
        <div><span class="fl">Proteína (g)</span><input class="field" id="macroGoalP" type="number"></div>
        <div><span class="fl">Carbs (g)</span><input class="field" id="macroGoalC" type="number"></div>
        <div><span class="fl">Gordura (g)</span><input class="field" id="macroGoalG" type="number"></div>
        <div><span class="fl">Kcal</span><input class="field" id="macroGoalK" type="number"></div>
      </div>
    </div>
    <div class="fg"><label class="fl">Exibir no resumo</label>
      <div class="mfav-row">
        <button class="mtoggle on" id="macroShowK" onclick="toggleMacroShow(this)">Kcal</button>
        <button class="mtoggle on" id="macroShowP" onclick="toggleMacroShow(this)">Proteína</button>
        <button class="mtoggle on" id="macroShowC" onclick="toggleMacroShow(this)">Carbs</button>
        <button class="mtoggle on" id="macroShowG" onclick="toggleMacroShow(this)">Gordura</button>
      </div>
    </div>
    <div class="fg"><label class="fl">Refeições</label><div id="macroMealsEdit"></div></div>
    <div class="fg"><label class="fl">Alimentos custom</label><div id="macroCustomList"></div><button class="btn ghost" style="width:100%;margin-top:8px" onclick="macroOpenCustom()">+ Novo alimento custom</button></div>
    <button class="btn-primary" onclick="saveMacroSettings()">Salvar</button>
  </div>
</div>

<div class="overlay" id="setOverlay" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <div class="mh"><div class="mt">Ajustes</div><button class="x" onclick="closeSettings()">✕</button></div>
    <div class="set-tabs">
      <button class="set-tab active" data-st="geral" onclick="switchSet('geral')">Geral</button>
      <button class="set-tab" data-st="programa" onclick="switchSet('programa')">Programa</button>
      <button class="set-tab" data-st="volume" onclick="switchSet('volume')">Volume</button>
      <button class="set-tab" data-st="tema" onclick="switchSet('tema')">Tema</button>
      <button class="set-tab" data-st="sobre" onclick="switchSet('sobre')">Sobre</button>
    </div>
    <div class="set-pane" data-pane="geral">
      <div class="fg"><label class="fl">Unidade de peso</label><div id="setUnit"></div></div>
      <div class="fg"><label class="fl">Descanso padrão (segundos)</label><input class="field" id="setRest" type="number" inputmode="numeric" onchange="saveDefault('rest',this.value)"></div>
      <div class="fg"><label class="fl">Incremento de carga (kg)</label><input class="field" id="setInc" type="number" inputmode="decimal" step="0.5" onchange="saveDefault('inc',this.value)"></div>
      <div class="fg"><label class="fl">Biblioteca de exercícios</label><button class="btn ghost" style="width:100%" onclick="loadDefaults()">↻ Carregar exercícios padrão (inclui calistenia)</button></div>
    </div>
    <div class="set-pane" data-pane="programa" style="display:none">
      <div class="fg"><label class="fl">Programa semanal</label><div id="setSched"></div></div>
    </div>
    <div class="set-pane" data-pane="volume" style="display:none">
      <div class="fg"><label class="fl">Grupos musculares</label><div id="setTags"></div><div style="display:flex;gap:8px;margin-top:10px"><input class="field" id="newTag" placeholder="Novo grupo…"><button class="btn" onclick="addTag()">Adicionar</button></div></div>
      <div class="fg"><label class="fl">Metas de volume (séries/semana)</label><div id="setVol"></div></div>
    </div>
    <div class="set-pane" data-pane="tema" style="display:none">
      <div class="fg"><label class="fl">Tema do app</label><div id="setSkins"></div></div>
    </div>
    <div class="set-pane" data-pane="sobre" style="display:none">
      <div class="fg"><button class="btn ghost" style="width:100%" onclick="verTutorial()">🧭 Ver tutorial</button></div>
      <div class="fg"><button class="btn ghost" style="width:100%" onclick="JB.feedback('Joelboard Fit')">💬 Enviar feedback</button></div>
      <div class="fg"><button class="del" style="width:100%" onclick="fitSignOut()">Sair</button></div>
      <div class="rg" style="text-align:center;font-size:11px;margin-top:4px">Joelboard Fit</div>
    </div>
    <button class="btn-primary" onclick="closeSettings()">Pronto</button>
  </div>
</div>
<div id="restBar" class="restbar" style="display:none"></div>
<div class="toast" id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<script src="/joelboard.js"></script>
<script src="/fit.js"></script>
<script src="/fit-macros.js"></script>
</body>
</html>

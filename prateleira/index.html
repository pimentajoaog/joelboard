<!DOCTYPE html>
<!-- Joelboard Prateleira (Julioelboard). © 2026 Joel Soluções LTDA. -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Julioelboard Prateleira</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/joelboard.css">
<script src="/skin-boot.js"></script>
<link rel="stylesheet" href="/themes.css">
<meta name="theme-color" content="#0d0f18">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Chakra+Petch:wght@500;600;700&family=Cormorant+Garamond:wght@500;600&family=Darker+Grotesque:wght@500;700;900&family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/prateleira.css">
</head>
<body>
<div id="loading"></div>
<div id="app" class="hidden">
  <div class="header">
    <div class="hl"><a class="hub-home" href="/" title="Voltar ao Hub" aria-label="Voltar ao Hub"><img src="/icon-192.png" alt="Joelboard"></a><h1>Prateleira</h1></div>
    <div class="acct"><span id="acctEmail"></span><button class="lnk" id="prRefreshBtn" onclick="refreshPrateleira()" title="Atualizar">↻</button><button class="lnk" onclick="openPrateleiraSet()" title="Ajustes">⚙</button><button class="lnk" onclick="prateleiraSignOut()">Sair</button></div>
  </div>
  <div class="tabs" id="mainTabs">
    <button class="tab on" data-tab="lib" onclick="prateleiraTab('lib')">Biblioteca</button>
    <button class="tab" data-tab="search" onclick="prateleiraTab('search')">Buscar</button>
  </div>
  <div id="main"></div>
  <div class="foot">© 2026 Joel Soluções LTDA · Julioelboard</div>
</div>

<button class="door" onclick="location.href='/'" title="Voltar ao Hub" aria-label="Voltar ao Hub">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4h3a2 2 0 0 1 2 2v14"/><path d="M2 20h3"/><path d="M13 20h9"/><path d="M10 12v.01"/><path d="M13 4.562v16.157a1 1 0 0 1-1.242.97L5 20V5.562a2 2 0 0 1 1.515-1.94l4-1A2 2 0 0 1 13 4.561Z"/></svg>
</button>

<div class="overlay" id="detailOv" onclick="if(event.target===this)closeDetail()">
  <div class="modal detail-modal">
    <div class="mh"><div class="mt" id="detailTitle">Título</div><button class="x" onclick="closeDetail()">✕</button></div>
    <div id="detailBody"></div>
  </div>
</div>

<div class="overlay" id="setOverlay" onclick="if(event.target===this)closePrateleiraSet()">
  <div class="modal">
    <div class="mh"><div class="mt">Ajustes</div><button class="x" onclick="closePrateleiraSet()">✕</button></div>
    <div class="set-tabs">
      <button class="set-tab active" data-st="tema" onclick="prateleiraSetTab('tema')">Tema</button>
      <button class="set-tab" data-st="perfil" onclick="prateleiraSetTab('perfil')">Perfil</button>
      <button class="set-tab" data-st="sheet" onclick="prateleiraSetTab('sheet')">Planilha</button>
    </div>
    <div class="set-pane" data-pane="tema">
      <div class="fg"><label class="fl">Tema do app</label><div id="prateleiraSkins"></div></div>
    </div>
    <div class="set-pane" data-pane="perfil" style="display:none">
      <div class="fg">
        <label class="fl">Seu ícone na prateleira</label>
        <p class="rg">Aparece junto às estrelas em cada título. Só você altera o seu, mas vocês dois veem o ícone um do outro.</p>
        <div class="icon-pick-row">
          <span id="prIconPreview" class="icon-preview" aria-hidden="true">🐻</span>
          <input class="field" id="prUserIcon" maxlength="8" placeholder="Emoji (ex.: 🐻)">
        </div>
        <button type="button" class="btn ghost" style="width:100%;margin-top:8px" onclick="savePrateleiraIcon()">Salvar ícone</button>
      </div>
    </div>
    <div class="set-pane" data-pane="sheet" style="display:none">
      <div class="fg"><label class="fl">Planilha compartilhada</label>
        <p class="rg" id="sheetInfo">—</p>
        <p class="rg" style="font-size:11px;margin-bottom:8px">Cole o <b>link</b> ou ID da planilha do Joel. Vocês dois precisam usar a mesma — compartilhe no Google Sheets como Editor.</p>
        <input class="field" id="sheetIdIn" placeholder="Link ou ID da planilha">
        <button class="btn ghost" style="width:100%;margin-top:8px" onclick="saveSheetId()">Usar este ID</button>
        <button class="btn ghost" style="width:100%;margin-top:8px" onclick="useDefaultSheet()">Usar planilha padrão (Joel)</button>
        <button class="btn ghost" style="width:100%;margin-top:8px" onclick="createSharedSheet()">Criar planilha nova</button>
      </div>
    </div>
    <button class="btn-primary" onclick="closePrateleiraSet()">Pronto</button>
  </div>
</div>

<script src="/joelboard.js"></script>
<script src="/prateleira.js"></script>
</body>
</html>

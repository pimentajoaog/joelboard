<!DOCTYPE html>
<!-- Joelboard Mini — launcher. © 2026 Joel Soluções LTDA. -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joelboard Mini</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="wrap">
  <header class="head">
    <img src="icons/icon-192.png" alt="" width="28" height="28">
    <div>
      <div class="title">Joelboard Mini</div>
      <div class="sub">Escolha uma ferramenta</div>
    </div>
  </header>

  <a class="tool" href="replace/popup.html" data-tool="replace">
    <span class="tool-ico replace" aria-hidden="true">+</span>
    <span class="tool-copy">
      <span class="tool-name">Replace</span>
      <span class="tool-desc">Expansão de texto — gatilhos e templates</span>
    </span>
    <span class="tool-go" aria-hidden="true">→</span>
  </a>

  <a class="tool" href="refresh/popup.html" data-tool="refresh">
    <span class="tool-ico refresh" aria-hidden="true">↻</span>
    <span class="tool-copy">
      <span class="tool-name">Refresh</span>
      <span class="tool-desc">Auto-reload da aba — intervalo e atalho</span>
    </span>
    <span class="tool-go" aria-hidden="true">→</span>
  </a>

  <p class="foot">Hub → Mini · <a href="https://joelboard.vercel.app/" target="_blank" rel="noopener">joelboard.vercel.app</a></p>
</div>
</body>
</html>

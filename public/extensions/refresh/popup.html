<!DOCTYPE html>
<!-- Joelboard Refresh — popup. © 2026 Joel Soluções LTDA. -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joelboard Refresh</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="wrap">
  <header class="head">
    <img src="icons/icon-192.png" alt="" width="28" height="28">
    <div>
      <div class="title">Refresh</div>
      <div class="sub">Joelboard Mini</div>
    </div>
  </header>

  <div class="tab-url" id="tabUrl" title="">—</div>

  <div class="status" id="status">
    <span class="status-dot"></span>
    <span class="status-label" id="statusLabel">Parado</span>
    <span class="status-detail" id="statusDetail"></span>
  </div>

  <label class="fl" for="intervalVal">Intervalo</label>
  <div class="interval-row">
    <input class="field num" id="intervalVal" type="number" min="3" max="3600" value="30">
    <select class="field" id="intervalUnit">
      <option value="sec">segundos</option>
      <option value="min">minutos</option>
    </select>
  </div>

  <div class="presets" id="presets">
    <button type="button" class="chip" data-sec="5">5 s</button>
    <button type="button" class="chip" data-sec="10">10 s</button>
    <button type="button" class="chip" data-sec="30">30 s</button>
    <button type="button" class="chip" data-sec="60">1 min</button>
    <button type="button" class="chip" data-sec="300">5 min</button>
  </div>

  <label class="tog">
    <input type="checkbox" id="pauseInactive" checked>
    Pausar quando a aba estiver inativa
  </label>

  <div class="actions">
    <button class="btn" id="btnStart">Iniciar</button>
    <button class="btn stop" id="btnStop" disabled>Parar</button>
  </div>

  <label class="fl" for="shortcutBtn">Atalho</label>
  <button type="button" class="field shortcut-btn" id="shortcutBtn">—</button>
  <p class="hint shortcut-hint" id="shortcutHint">Clique acima e pressione a nova combinação. Funciona na página enquanto ela estiver em foco.</p>

  <p class="hint" id="shortcutUse">Use o atalho para alternar nesta aba.</p>
</div>

<div class="toast" id="toast"></div>

<script src="lib/shared.js"></script>
<script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<!-- Joelboard Study. © 2026 Joel Soluções LTDA. -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Joelboard Study</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/joelboard.css">
<script src="/skin-boot.js"></script>
<link rel="stylesheet" href="/themes.css">
<meta name="theme-color" content="#0d0f18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Chakra+Petch:wght@500;600;700&family=Cormorant+Garamond:wght@500;600&family=Darker+Grotesque:wght@500;700;900&family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/study.css">
</head>
<body>
<div id="loading"></div>

<div id="app">
  <div class="header">
    <div class="hl"><a class="hub-home" href="/" title="Voltar ao Joelboard" aria-label="Voltar ao Joelboard"><img src="/icon-192.png" alt="Joelboard"></a><h1>Study</h1></div>
    <div class="acct"><span id="acctEmail"></span><button class="lnk" onclick="openSettings()" title="Ajustes">⚙</button><button class="lnk" onclick="studySignOut()">Sair</button></div>
  </div>
  <div class="tabbar">
    <button class="tabb on" data-tab="calendario" onclick="tab('calendario')">Calendário</button>
    <button class="tabb" data-tab="materias" onclick="tab('materias')">Matérias</button>
  </div>

  <div class="page on" id="p-calendario"><div id="cal"></div></div>
  <div class="page" id="p-materias">
    <div class="secbar"><div class="sect">Suas matérias</div><button class="btn" onclick="openMat(null)">+ Adicionar</button></div>
    <div id="matList"></div>
  </div>

  <div class="foot">© 2026 Joel Soluções LTDA</div>
</div>

<button class="door" onclick="location.href='/'" title="Voltar ao Joelboard" aria-label="Voltar ao Joelboard">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4h3a2 2 0 0 1 2 2v14"/><path d="M2 20h3"/><path d="M13 20h9"/><path d="M10 12v.01"/><path d="M13 4.562v16.157a1 1 0 0 1-1.242.97L5 20V5.562a2 2 0 0 1 1.515-1.94l4-1A2 2 0 0 1 13 4.561Z"/></svg>
</button>
<button class="fab" id="fab" onclick="fab()" title="Novo item">+</button>

<div class="overlay" id="evtOverlay" onclick="if(event.target===this)closeEvt()">
  <div class="modal">
    <div class="mh"><div class="mt" id="evtTitle">Novo item</div><button class="x" onclick="closeEvt()">✕</button></div>
    <div class="fg"><label class="fl">Título</label><input class="field" id="evtTitulo" placeholder="ex.: Prova de Cálculo II"></div>
    <div class="fg"><label class="fl">Tipo</label><div id="evtTipoWrap"></div></div>
    <div class="fg"><label class="fl">Matéria</label><div id="evtMatWrap"></div></div>
    <div style="display:flex;gap:10px">
      <div class="fg" style="flex:1"><label class="fl">Data</label><button type="button" class="field datebtn empty" id="evtData" data-iso="" data-ph="dd/mm/aaaa" onclick="JB.dpOpen('evtData')">dd/mm/aaaa</button></div>
      <div class="fg" style="flex:0 0 38%"><label class="fl">Hora (opcional)</label><input class="field" id="evtHora" type="time"></div>
    </div>
    <div class="fg"><label class="fl">Notas</label><textarea class="field" id="evtNotas" placeholder="Conteúdo, capítulos, link…"></textarea></div>
    <div class="fg"><button class="tg" id="evtConcluido" onclick="toggleEvtDone()">Concluído / entregue</button></div>
    <div class="fg" id="evtAnexosWrap" style="display:none"><label class="fl">Anexos</label><div id="evtAnexos"></div></div>
    <button class="btn-primary" onclick="saveEvt()">Salvar</button>
    <button class="del" id="evtDel" onclick="deleteEvt()" style="display:none;">Excluir item</button>
  </div>
</div>

<div class="overlay" id="matOverlay" onclick="if(event.target===this)closeMat()">
  <div class="modal">
    <div class="mh"><div class="mt" id="matTitle">Nova matéria</div><button class="x" onclick="closeMat()">✕</button></div>
    <div class="fg"><label class="fl">Nome</label><input class="field" id="matNome" placeholder="ex.: Cálculo II"></div>
    <div class="fg"><label class="fl">Cor</label><div id="matColors" style="display:flex;gap:8px;flex-wrap:wrap"></div></div>
    <div style="display:flex;gap:10px">
      <div class="fg" style="flex:1"><label class="fl">Total de aulas</label><input class="field" id="matTotal" type="number" inputmode="numeric" placeholder="ex.: 40"></div>
      <div class="fg" style="flex:1"><label class="fl">Aulas feitas</label><input class="field" id="matFeitas" type="number" inputmode="numeric" value="0"></div>
    </div>
    <div class="fg" id="matAnexosWrap" style="display:none"><label class="fl">Materiais</label><div id="matAnexos"></div></div>
    <button class="btn-primary" onclick="saveMat()">Salvar</button>
    <button class="del" id="matDel" onclick="deleteMat()" style="display:none;">Excluir matéria</button>
  </div>
</div>

<div class="overlay" id="linkOverlay" onclick="if(event.target===this)closeLink()">
  <div class="modal"><div class="mh"><div class="mt">Vincular material</div><button class="x" onclick="closeLink()">✕</button></div><div id="linkList" style="max-height:380px;overflow-y:auto"></div></div>
</div>
<div class="overlay" id="setOverlay" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <div class="mh"><div class="mt">Ajustes</div><button class="x" onclick="closeSettings()">✕</button></div>
    <div class="set-tabs">
      <button class="set-tab active" data-st="tema" onclick="switchSet('tema')">Tema</button>
      <button class="set-tab" data-st="foco" onclick="switchSet('foco')">Foco</button><button class="set-tab" data-st="sobre" onclick="switchSet('sobre')">Sobre</button>
    </div>
    <div class="set-pane" data-pane="tema">
      <div class="fg"><label class="fl">Tema do app</label><div id="setSkins"></div></div>
    </div>
    <div class="set-pane" data-pane="foco" style="display:none">
      <div style="display:flex;gap:10px">
        <div class="fg" style="flex:1"><label class="fl">Foco (min)</label><input class="field" id="focoMin" type="number" inputmode="numeric" onchange="saveFocoCfg()"></div>
        <div class="fg" style="flex:1"><label class="fl">Pausa (min)</label><input class="field" id="pausaMin" type="number" inputmode="numeric" onchange="saveFocoCfg()"></div>
      </div>
      <div style="display:flex;gap:10px">
        <div class="fg" style="flex:1"><label class="fl">Pausa longa (min)</label><input class="field" id="longMin" type="number" inputmode="numeric" onchange="saveFocoCfg()"></div>
        <div class="fg" style="flex:1"><label class="fl">Ciclos p/ longa</label><input class="field" id="cycLong" type="number" inputmode="numeric" onchange="saveFocoCfg()"></div>
      </div>
    </div>
    <div class="set-pane" data-pane="sobre" style="display:none">
      <div class="fg"><button class="btn ghost" style="width:100%" onclick="studyVerTutorial()">🧭 Ver tutorial</button></div>
      <div class="fg"><button class="btn ghost" style="width:100%" onclick="JB.feedback('Joelboard Study')">💬 Enviar feedback</button></div>
      <div class="fg"><button class="del" style="width:100%" onclick="studySignOut()">Sair</button></div>
      <div class="rg" style="text-align:center;font-size:11px;margin-top:4px">Joelboard Study</div>
    </div>
    <button class="btn-primary" onclick="closeSettings()">Pronto</button>
  </div>
</div>

<div class="focover" id="focoOverlay">
  <div class="foctop" id="focTop"></div>
  <div class="focstage" id="focStage"></div>
  <div class="focbtm" id="focBtm"></div>
</div>
<input type="file" id="fileInput" style="display:none" onchange="onFilePicked()">
<div class="toast" id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async></script>
<script src="/joelboard.js"></script>
<script src="/study.js"></script>
</body>
</html>
